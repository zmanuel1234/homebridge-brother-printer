<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Printers</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 1.25rem;
    background: #f5f5f7; color: #1d1d1f; }
  @media (prefers-color-scheme: dark) { body { background: #1c1c1e; color: #f2f2f7; } }
  h1 { font-size: 1.3rem; margin: 0 0 1rem; display: flex; justify-content: space-between; align-items: baseline; }
  h1 small { font-size: .8rem; font-weight: normal; opacity: .7; }
  .pd-card { background: rgba(128,128,128,.08); }
</style>
</head>
<body>
<h1>Printers <small id="when"></small></h1>
<div id="printers"><p style="opacity:.7">Loading…</p></div>
<script src="dashboard.js"></script>
<script>
  async function load() {
    try {
      const res = await fetch('api/printers', { cache: 'no-store' });
      if (!res.ok) { throw new Error(`HTTP ${res.status}`); }
      PrinterDashboard.render(document.getElementById('printers'), await res.json());
      document.getElementById('when').textContent = `Checked ${new Date().toLocaleTimeString()}`;
    } catch (err) {
      document.getElementById('when').textContent = `Homebridge didn't answer (${err.message})`;
    }
  }
  load();
  setInterval(load, 30000);
</script>
</body>
</html>
