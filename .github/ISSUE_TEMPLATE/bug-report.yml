name: Bug report
description: Something in the plugin doesn't work as described.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Printer model
      placeholder: MFC-L2750DW
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Plugin version
      placeholder: 0.6.0
    validations:
      required: true
  - type: input
    id: homebridge
    attributes:
      label: Homebridge and Node.js versions
      description: Shown on the Homebridge UI's status page.
      placeholder: Homebridge 2.5.0, Node.js 24.11.0
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Your printer's settings
      description: The printer's entry from `config.json`. Remove the community string and any SNMPv3 passwords.
      render: json
  - type: textarea
    id: log
    attributes:
      label: Log
      description: The plugin's lines from the Homebridge log, ideally with **Log every poll** (`debug`) turned on.
      render: text
