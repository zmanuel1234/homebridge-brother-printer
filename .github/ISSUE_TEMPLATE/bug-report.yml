name: Bug report
description: Something doesn't work as the README describes.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please **never paste passwords, tokens or keys**: replace them with `xxx` in anything you paste or attach.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      description: What you did, step by step, and whether it happens every time.
      placeholder: |
        1. ...
        2. ...
  - type: input
    id: versions
    attributes:
      label: Versions
      description: This plugin, Homebridge and Node.js.
      placeholder: "1.0.0, Homebridge 2.5.0, Node.js 24.11.0"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and model
      description: "What the plugin talks to."
      placeholder: "Example device, model X1"
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: Plugin settings
      description: "The plugin's part of config.json (Homebridge UI → the plugin → JSON config). **Replace passwords, tokens and keys with xxx.**"
      render: json
  - type: textarea
    id: log
    attributes:
      label: Log
      description: "The plugin's lines from the Homebridge log around the problem. Remove anything private."
      render: text
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I'm on the latest version of the plugin.
          required: true
        - label: I searched the existing issues.
          required: true
        - label: There are no secrets in what I pasted.
          required: true
