name: Feature request
description: Suggest an improvement to homebridge-brother-printer.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you'd like to do
      description: What you're trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How it could work
      description: "Which printer, and what you'd expect to see in the Home app or Eve."
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Alternatives you've tried, screenshots, links.
